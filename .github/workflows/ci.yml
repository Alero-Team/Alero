name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo test -p pb-core -p pb-cli -p pb-ffi
      # The vectors file must be exactly what the independent Python generator produces.
      - if: matrix.os == 'ubuntu-latest'
        run: |
          python3 -I protocol/vectors/generate_framing.py
          git diff --exit-code protocol/vectors/framing.json
