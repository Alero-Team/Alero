name: Packages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a preliminary release after building
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  packages:
    # An explicitly scoped Android-only hotfix must not rebuild Windows.
    if: ${{ !contains(github.event.head_commit.message, '[android-only]') }}
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      # Pinned to a commit (v2.9.1): a moved tag must not run new code next to the signing key.
      - uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: cargo fetch --locked
      - name: Resolve Flutter dependencies
        shell: pwsh
        working-directory: app
        run: flutter pub get --enforce-lockfile
      - run: rustup target add aarch64-linux-android
      # The signing key exists only inside this step: it is written, used by Gradle and deleted here, so no
      # other step (dependency fetches, choco, the Windows build, uploads) ever sees it or its passwords.
      - name: Build signed Android APK
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ALERO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALERO_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ALERO_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if (!$env:SIGNING_KEY) { throw 'Configure the Android signing secrets before building packages.' }
          $keyFile = Join-Path $env:RUNNER_TEMP 'alero-signing.keystore'
          [IO.File]::WriteAllBytes($keyFile, [Convert]::FromBase64String($env:SIGNING_KEY))
          $env:SIGNING_KEY = $null
          $env:ALERO_ANDROID_KEYSTORE = $keyFile
          try {
            $flutterRoot = Split-Path (Split-Path (Get-Command flutter).Source)
            ./tools/build-android.ps1 -FlutterRoot $flutterRoot -AndroidSdk $env:ANDROID_HOME -SkipAnalyze
          } finally {
            Remove-Item -LiteralPath $keyFile -ErrorAction SilentlyContinue
          }
      - name: Verify signed release APK
        shell: pwsh
        run: |
          $apk = Get-ChildItem dist -Filter '*-android-arm64.apk' | Select-Object -First 1
          if (!$apk) { throw 'Android APK missing' }
          $tool = Get-ChildItem "$env:ANDROID_HOME/build-tools" -Filter apksigner.bat -Recurse |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (!$tool) { throw 'Android apksigner unavailable' }
          $out = & $tool.FullName verify --verbose --print-certs $apk.FullName
          if ($LASTEXITCODE -ne 0) { throw 'APK signature verification failed' }
          $out
          # Installed copies only accept updates from this signer: a different key must never be published.
          if (-not ($out -match '59b6277d2183eda236122557e8f55f4d55fc62bf6071e2f6111a1dccdc20adaa')) {
            throw 'APK is not signed with the expected release certificate'
          }
      - name: Install packaging tools
        run: choco install innosetup --yes --no-progress
      - name: Windows package
        shell: pwsh
        run: |
          $flutterRoot = Split-Path (Split-Path (Get-Command flutter).Source)
          ./tools/build-windows.ps1 -FlutterRoot $flutterRoot -SkipAnalyze
      - uses: actions/upload-artifact@v4
        with:
          name: Alero-packages
          path: dist/*
          if-no-files-found: error
      - name: Remove temporary signing key
        if: always()
        shell: pwsh
        run: |
          $keyFile = Join-Path $env:RUNNER_TEMP 'alero-signing.keystore'
          if (Test-Path -LiteralPath $keyFile) { Remove-Item -LiteralPath $keyFile }
  linux:
    # The Linux packages never block the Windows and Android release: if this job fails, the release goes out without
    # them (the failure is still annotated on the run). Ubuntu 22.04 (glibc 2.35) so the build runs on Debian 12+.
    if: ${{ !contains(github.event.head_commit.message, '[android-only]') }}
    continue-on-error: true
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # Same pinned commit and Flutter version as the other jobs.
      - uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev \
            libayatana-appindicator3-dev libdbus-1-dev libxdo-dev liblzma-dev rpm
      # appimagetool 1.9.1, pinned by hash: a moved release must not run new code in the build.
      - name: Install appimagetool
        run: |
          sudo curl -fsSL -o /usr/local/bin/appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  /usr/local/bin/appimagetool' | sha256sum -c -
          sudo chmod +x /usr/local/bin/appimagetool
      - run: cargo fetch --locked
      - run: bash tools/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Alero-linux
          path: dist/*
          if-no-files-found: error
  publish:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish) }}
    needs: [packages, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: Alero-packages
          path: dist
      # Missing when the Linux job failed or was skipped: the release then has no Linux files.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Alero-linux
          path: dist
      - name: Publish Alero release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' app/pubspec.yaml)
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "::notice::v$version is already published; bump the version to release again."
            exit 0
          fi
          # Changelog headings are "## 1.0.0 — date" or "## Beta 1.1.1 (1.1.1) — date".
          v=${version//./\\.}
          heading=$(grep -m1 -E "^## ($v |.*\($v\))" CHANGELOG.md) || { echo "::error::No CHANGELOG section for $version"; exit 1; }
          name=$(echo "$heading" | sed -E 's/^## //; s/ \(.*//; s/ — .*//')
          # One checksum list for every package (the per-file .sha256 sidecars are folded into it).
          rm -f dist/*.sha256
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
          {
            # This version's section of the changelog, then the hashes.
            awk -v h="$heading" '$0 == h {on=1; next} on && /^## / {exit} on' CHANGELOG.md
            echo
            echo '### SHA-256'
            echo
            echo '| Archivo | SHA-256 |'
            echo '| --- | --- |'
            while read -r hash file; do echo "| \`${file#\*}\` | \`$hash\` |"; done < dist/SHA256SUMS.txt
          } > notes.md
          grep -q '^- ' notes.md && grep -q 'SHA-256' notes.md
          gh release create "v$version" dist/* --target "$GITHUB_SHA" --title "Alero $name" --notes-file notes.md
