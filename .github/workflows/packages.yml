name: Packages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a preliminary release after building
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  packages:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare signing identity
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if (!$env:SIGNING_KEY) { throw 'Configure the Android signing secrets before building packages.' }
          $keyFile = Join-Path $env:RUNNER_TEMP 'alero-signing.keystore'
          [IO.File]::WriteAllBytes($keyFile, [Convert]::FromBase64String($env:SIGNING_KEY))
          "ALERO_ANDROID_KEYSTORE=$keyFile" >> $env:GITHUB_ENV
          "ALERO_ANDROID_KEYSTORE_PASSWORD=$env:SIGNING_PASSWORD" >> $env:GITHUB_ENV
          "ALERO_ANDROID_KEY_ALIAS=$env:SIGNING_ALIAS" >> $env:GITHUB_ENV
          "ALERO_ANDROID_KEY_PASSWORD=$env:SIGNING_KEY_PASSWORD" >> $env:GITHUB_ENV
      - run: cargo fetch --locked
      # The release is published only if every test passes (Checks runs separately and does not gate it).
      - run: cargo test --locked --workspace
      - name: Flutter analyze and tests
        shell: pwsh
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'pub get failed' }
          flutter analyze --no-pub
          if ($LASTEXITCODE -ne 0) { throw 'analyze failed' }
          flutter test --no-pub
          if ($LASTEXITCODE -ne 0) { throw 'Flutter tests failed' }
      - run: rustup target add aarch64-linux-android
      - name: Android package and storage tests
        shell: pwsh
        run: |
          $flutterRoot = Split-Path (Split-Path (Get-Command flutter).Source)
          ./tools/build-android.ps1 -FlutterRoot $flutterRoot -AndroidSdk $env:ANDROID_HOME
          Push-Location app/android
          ./gradlew.bat :app:testDebugUnitTest
          if ($LASTEXITCODE -ne 0) { throw 'Android tests failed' }
          Pop-Location
      - name: Verify signed release APK
        shell: pwsh
        run: |
          $apk = Get-ChildItem dist -Filter '*-android-arm64.apk' | Select-Object -First 1
          if (!$apk) { throw 'Android APK missing' }
          $tool = Get-ChildItem "$env:ANDROID_HOME/build-tools" -Filter apksigner.bat -Recurse |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (!$tool) { throw 'Android apksigner unavailable' }
          & $tool.FullName verify --verbose --print-certs $apk.FullName
          if ($LASTEXITCODE -ne 0) { throw 'APK signature verification failed' }
      - name: Install packaging tools
        run: choco install innosetup --yes --no-progress
      - name: Windows package
        shell: pwsh
        run: |
          $flutterRoot = Split-Path (Split-Path (Get-Command flutter).Source)
          ./tools/build-windows.ps1 -FlutterRoot $flutterRoot
      - uses: actions/upload-artifact@v4
        with:
          name: Alero-packages
          path: dist/*
          if-no-files-found: error
      - name: Remove temporary signing key
        if: always()
        shell: pwsh
        run: |
          $keyFile = Join-Path $env:RUNNER_TEMP 'alero-signing.keystore'
          if (Test-Path -LiteralPath $keyFile) { Remove-Item -LiteralPath $keyFile }
  publish:
    if: github.event_name == 'push' || inputs.publish
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Alero-packages
          path: dist
      - name: Publish preliminary release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' app/pubspec.yaml)
          # One checksum list for every package (the per-file .sha256 sidecars are folded into it).
          rm -f dist/*.sha256
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
          {
            # This version's section of the changelog, then the hashes.
            awk -v v="## $version " 'index($0, v) == 1 {on=1; next} on && /^## / {exit} on' CHANGELOG.md
            echo
            echo '### SHA-256'
            echo
            echo '| Archivo | SHA-256 |'
            echo '| --- | --- |'
            while read -r hash file; do echo "| \`${file#\*}\` | \`$hash\` |"; done < dist/SHA256SUMS.txt
          } > notes.md
          grep -q 'SHA-256' notes.md && grep -q 'Errores corregidos' notes.md
          gh release create "v$version" dist/* --target "$GITHUB_SHA" --title "Alero $version" --prerelease --notes-file notes.md
