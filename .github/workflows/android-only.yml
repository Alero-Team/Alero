name: Android-only release
on:
  push:
    branches:
      - main
      - fix/android-consent-and-review-v0.1.15
permissions:
  contents: read
jobs:
  android:
    if: ${{ github.ref_name == 'fix/android-consent-and-review-v0.1.15' || contains(github.event.head_commit.message, '[android-only]') }}
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare existing signing identity
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if (!$env:SIGNING_KEY) { throw 'Existing Android signing identity is required' }
          $keyFile = Join-Path $env:RUNNER_TEMP 'alero-android-only.keystore'
          [IO.File]::WriteAllBytes($keyFile, [Convert]::FromBase64String($env:SIGNING_KEY))
          "ALERO_ANDROID_KEYSTORE=$keyFile" >> $env:GITHUB_ENV
          "ALERO_ANDROID_KEYSTORE_PASSWORD=$env:SIGNING_PASSWORD" >> $env:GITHUB_ENV
          "ALERO_ANDROID_KEY_ALIAS=$env:SIGNING_ALIAS" >> $env:GITHUB_ENV
          "ALERO_ANDROID_KEY_PASSWORD=$env:SIGNING_KEY_PASSWORD" >> $env:GITHUB_ENV
      - name: Verify essential Android features and sensitive permissions remain
        shell: pwsh
        run: |
          $manifest = Get-Content 'app/android/app/src/main/AndroidManifest.xml' -Raw
          foreach ($required in @(
            'android.permission.READ_SMS',
            'android.permission.SEND_SMS',
            'android.permission.READ_CALL_LOG',
            'android.permission.READ_CONTACTS',
            'android.permission.BIND_NOTIFICATION_LISTENER_SERVICE',
            '.DesktopHomeActivity',
            '.DevicesWidget')) {
            if (!$manifest.Contains($required)) { throw "Regression: $required missing from manifest" }
          }
          Write-Output 'Feature and permission preservation: PASS'
      - run: cargo fetch --locked
      - run: cargo test --locked --workspace
      - name: Flutter analyze and tests
        shell: pwsh
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Flutter dependencies failed' }
          flutter analyze --no-pub
          if ($LASTEXITCODE -ne 0) { throw 'Flutter analyze failed' }
          flutter test --no-pub
          if ($LASTEXITCODE -ne 0) { throw 'Flutter tests failed' }
      - run: rustup target add aarch64-linux-android
      - name: Compile Android APK and run Kotlin unit tests
        shell: pwsh
        run: |
          $flutterRoot = Split-Path (Split-Path (Get-Command flutter).Source)
          ./tools/build-android.ps1 -FlutterRoot $flutterRoot -AndroidSdk $env:ANDROID_HOME
          if ($LASTEXITCODE -ne 0) { throw 'APK build failed' }
          Push-Location app/android
          ./gradlew.bat :app:testDebugUnitTest
          if ($LASTEXITCODE -ne 0) { throw 'Android unit tests failed' }
          Pop-Location
      - name: Verify original release signer and APK integrity
        shell: pwsh
        run: |
          $apk = Get-ChildItem dist -Filter '*-android-arm64.apk' | Select-Object -First 1
          if (!$apk) { throw 'Android APK missing' }
          $tool = Get-ChildItem "$env:ANDROID_HOME/build-tools" -Filter apksigner.bat -Recurse | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$tool) { throw 'Android apksigner unavailable' }
          $info = (& $tool.FullName verify --verbose --print-certs $apk.FullName | Out-String)
          if ($LASTEXITCODE -ne 0) { throw 'APK signature is invalid' }
          if ($info -notmatch 'certificate SHA-256 digest:\s*([0-9a-fA-F]{64})') { throw 'Signer fingerprint unavailable' }
          $fingerprint = $Matches[1].ToLowerInvariant()
          $expected = '59b6277d2183eda236122557e8f55f4d55fc62bf6071e2f6111a1dccdc20adaa'
          if ($fingerprint -ne $expected) { throw "Signing identity changed: $fingerprint" }
          Write-Output "Original APK signing certificate verified: $fingerprint"
      - uses: actions/upload-artifact@v4
        with:
          name: Alero-Android-only
          path: |
            dist/*-android-arm64.apk
            dist/*-android-arm64.apk.sha256
          if-no-files-found: error
      - name: Remove temporary signing key
        if: always()
        shell: pwsh
        run: |
          $keyFile = Join-Path $env:RUNNER_TEMP 'alero-android-only.keystore'
          if (Test-Path -LiteralPath $keyFile) { Remove-Item -LiteralPath $keyFile }
  publish:
    if: ${{ github.ref_name == 'main' && contains(github.event.head_commit.message, '[android-only]') }}
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Alero-Android-only
          path: dist
      - name: Publish Android-only candidate with honest Play Protect status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' app/pubspec.yaml)
          test -f "dist/Alero-$version-android-arm64.apk"
          {
            awk -v v="## $version " 'index($0, v) == 1 {on=1; next} on && /^## / {exit} on' CHANGELOG.md
            echo
            echo '### SHA-256'
            sha256sum "dist/Alero-$version-android-arm64.apk"
          } > notes.md
          grep -q 'Estado real de Play Protect' notes.md
          gh release create "v$version" dist/* --target "$GITHUB_SHA" --title "Alero $version · Android (candidata para revisión Play Protect)" --prerelease --notes-file notes.md
