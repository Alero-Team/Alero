[package]
name = "pb-daemon"
version = "0.1.0"
edition = "2021"
description = "Alero desktop tray daemon: owns the engine; the Flutter window is a client"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "alero_daemon"
path = "src/main.rs"

[dependencies]
pb-core = { path = "../core" }
serde_json = "1"
# Same versions Tauri already pulled in (Cargo.lock): nothing new to download or review.
tao = "0.37"
tray-icon = "0.25"
png = "0.18"
# Remote screen frames and screenshots. (MIT OR Apache-2.0) AND IJG: see docs/research/Licenses.md.
jpeg-encoder = "0.6.1"
# Already in Cargo.lock (0.21.7).
base64 = "0.21.7"

[target.'cfg(windows)'.dependencies]
# Same versions already in Cargo.lock (pulled by tao): toasts, clipboard and OS version without new crates.
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Power",
    "Win32_System_Shutdown",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Com",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Foundation",
    "Graphics_Imaging",
    "Media_Control",
    "Storage_Streams",
] }
windows-version = "0.1"
