[workspace]
members = ["core", "app/rust", "daemon"]
resolver = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
# The island draws every frame in software: its rasterizer is worth full speed even in a size-optimized build.
[profile.release.package.tiny-skia]
opt-level = 3
[profile.release.package.tiny-skia-path]
opt-level = 3

# The software compositor and pixel conversion need speed, as well as the rasterizer.
[profile.release.package.pb-daemon]
opt-level = 3
